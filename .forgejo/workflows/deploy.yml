# Builds the shop and deploys it to its Garage website bucket: on every push to main, every hour (so a
# product added in the admin appears without a push; prices and stock are live in the browser
# regardless), and by hand. Repository settings (Commercus' provisioning sets them, or by hand):
#   variables: PUBLIC_COMMERCUS_KEY (the shop's pk_…), S3_BUCKET (the shop's domain), SITE_URL,
#              optionally PUBLIC_COMMERCUS_API and S3_ENDPOINT
#   secrets:   S3_ACCESS_KEY, S3_SECRET_KEY (a key for this bucket only)
# Without the S3 key the shop is only built.
name: deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: docker
    timeout-minutes: 10
    container:
      image: node:22-bookworm-slim
    env:
      PUBLIC_COMMERCUS_API: ${{ vars.PUBLIC_COMMERCUS_API || 'https://api.commercus.nl' }}
      PUBLIC_COMMERCUS_KEY: ${{ vars.PUBLIC_COMMERCUS_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      AWS_ENDPOINT_URL: ${{ vars.S3_ENDPOINT || 'https://s3.ruddur.cloud' }}
      AWS_DEFAULT_REGION: garage
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Deploy
        if: env.AWS_ACCESS_KEY_ID != ''
        run: npm run deploy

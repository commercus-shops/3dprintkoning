# The template itself, on GitHub: it must build, with and without a shop to read from. Shops deploy
# with .forgejo/workflows/deploy.yml in their own repository.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

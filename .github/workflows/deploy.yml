# Builds the shop and deploys it to its S3 website bucket (Garage): on every push to main, every hour
# (so a product added in the Commercus admin appears without a push; prices and stock are live in the
# browser regardless), and by hand. Pull requests are only built.
#
# Repository settings:
#   variables: PUBLIC_COMMERCUS_KEY (the shop's pk_…), S3_BUCKET (the shop's domain), SITE_URL,
#              optionally PUBLIC_COMMERCUS_API and S3_ENDPOINT
#   secrets:   S3_ACCESS_KEY, S3_SECRET_KEY (a key for this bucket only)
# Without the S3 key the shop is only built, and without S3_BUCKET the hourly build is skipped.
# On Forgejo, .forgejo/workflows/deploy.yml does the same and this file is ignored.
name: deploy
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name != 'schedule' || vars.S3_BUCKET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_COMMERCUS_API: ${{ vars.PUBLIC_COMMERCUS_API || 'https://api.commercus.nl' }}
      PUBLIC_COMMERCUS_KEY: ${{ vars.PUBLIC_COMMERCUS_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      AWS_ENDPOINT_URL: ${{ vars.S3_ENDPOINT || 'https://s3.ruddur.cloud' }}
      AWS_DEFAULT_REGION: garage
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.AWS_ACCESS_KEY_ID != '' && env.S3_BUCKET != ''
        run: npm run deploy
